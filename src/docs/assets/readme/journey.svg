ext x="630" y="84" fill="#203E32" font-size="26" font-weight="400" font-family="Georgia, Liberation Serif, serif">Ambil</text><text x="630" y="113" fill="#626F64" font-size="16" font-weight="400" font-family="Lato, Arial, sans-serif">Tunjukkan QR atau OTP</text><text x="630" y="137" fill="#626F64" font-size="16" font-weight="400" font-family="Lato, Arial, sans-serif">dalam jadwal pickup</text><rect x="918" y="0" width="282" height="158" rx="20" fill="#F8F5EE" stroke="none"/><rect x="936" y="18" width="32" height="32" rx="16" fill="#E7ECDC" stroke="none"/><text x="946" y="40" fill="#2D634C" font-size="16" font-weight="700" font-family="Lato, Arial, sans-serif">4</text><text x="936" y="84" fill="#203E32" font-size="26" font-weight="400" font-family="Georgia, Liberation Serif, serif">Selesai</text><text x="936" y="113" fill="#626F64" font-size="16" font-weight="400" font-family="Lato, Arial, sans-serif">Validasi oleh mitra,</text><text x="936" y="137" fill="#626F64" font-size="16" font-weight="400" font-family="Lato, Arial, sans-serif">riwayat dan ulasan</text></svg>
